{% extends "central/layout.html" %}
{% block content %}
<section class="card" style="max-width:420px;margin:48px auto">
  <h1 style="margin-bottom:12px">Code aus der App</h1>
  {% if error %}<div class="banner error" style="margin-bottom:12px">{{ icon('error', 20) }}<span>{{ error }}</span></div>{% endif %}
  <form method="post" class="form"><input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field"><label for="c">6-stelliger Code oder Wiederherstellungscode</label><input id="c" name="code" required autofocus autocomplete="one-time-code" inputmode="numeric"></div>
    <button class="btn block" type="submit">Anmelden</button></form>
</section>
{% endblock %}
