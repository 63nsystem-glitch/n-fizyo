{# Sitzungszähler «3/9» – über der Verordnung («10/9») mit deutlichem Hinweis «ohne Verordnung». #}
{% macro session_label(session, beyond=False) -%}
<span class="nowrap">{{ session[0] }}/{{ session[1] or '?' }}</span>{% if beyond %} <span class="pill-label error sm" data-beyond-rx title="{{ t('agenda.beyond_rx_hint', n=session[0], total=session[1]) }}">{{ t('agenda.beyond_rx') }}</span>{% endif %}
