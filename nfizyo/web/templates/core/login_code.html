{% extends "layouts/auth.html" %}
{% block title %}{{ t('mfa.code_title') }}{% endblock %}
{% block content %}
<h1 style="margin-bottom:4px">{{ t('mfa.code_title') }}</h1>
<p class="muted" style="margin-bottom:24px">{{ t('mfa.code_intro') }}</p>
{% if error %}<div class="banner error" role="alert" style="margin-bottom:16px">{{ icon('error') }}<span>{{ t(error) }}</span></div>{% endif %}
<form method="post" action="/login/code" class="form">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="code">{{ t('mfa.code_label') }}</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="11"
           style="font-size:24px;letter-spacing:.2em;text-align:center" placeholder="123456"></div>
  <button class="btn lg block" type="submit">{{ t('mfa.confirm') }}</button>
</form>
<details style="margin-top:16px"><summary class="small muted">{{ t('mfa.no_phone') }}</summary>
  <p class="small muted" style="margin-top:8px">{{ t('mfa.no_phone_hint') }}</p></details>
<form method="post" action="/logout" style="margin-top:16px;text-align:center"><input type="hidden" name="_csrf" value="{{ csrf }}">
  <button class="btn text sm" type="submit">{{ t('mfa.cancel') }}</button></form>
{% endblock %}
