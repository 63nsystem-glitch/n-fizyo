[project]
name = "n-fizyo"
version = "0.9.0"
description = "N-Fizyo – Praxissoftware für Physiotherapie mit lokaler KI (NSystem GmbH, Biel/Bienne)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1",
    "pypdf>=6.21.4",   # Text aus PDF-Berichten (BSD) – ab 6.21.4 ohne bekannte DoS-Lücken
    "segno>=1.6",   # QR-Code für die App-Einladung (BSD)
    "cryptography>=42",  # Zwei-Schritt-Anmeldung, signierte Befehle (Apache-2.0/BSD)
    "lxml>=5",      # XML-Rechnung 5.0 + Schemaprüfung (BSD)
    "reportlab>=4", # PDF: Rechnung mit QR-Zahlteil, Bericht für HIN (BSD)
    "qrbill>=1.1",  # Swiss QR-Code-Inhalt (MIT)
    "openpyxl>=3.1",  # Datenübernahme aus Excel (MIT)
]

[project.optional-dependencies]
ai = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[tool.setuptools.packages.find]
include = ["nfizyo*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.sql", "*.html", "*.js", "*.css", "*.woff2", "*.svg", "*.txt", "*.xsd", "*.ttf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
